<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funnel Deviation Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 500px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 0;
        }

        .container {
            padding: 20px;
            background: white;
            height: 600px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 12px;
        }

        .header h1 {
            font-size: 18px;
            color: #333;
            flex: 1;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #e8f4f8;
            color: #0066cc;
        }

        .status-badge.active {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .status-badge.error {
            background: #ffcdd2;
            color: #c62828;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #efefef;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results-container {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 0;
            background: #f9f9f9;
        }

        .result-item {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            background: white;
            margin: 8px;
            border-radius: 4px;
            border-left: 4px solid #ff6b6b;
        }

        .result-item.normal {
            border-left-color: #51cf66;
        }

        .result-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .result-report {
            font-size: 12px;
            color: #666;
            font-family: 'Courier New', monospace;
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .result-meta {
            font-size: 11px;
            color: #999;
            display: flex;
            justify-content: space-between;
        }

        .severity-meter {
            display: inline-block;
            width: 80px;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            margin-left: 4px;
            vertical-align: middle;
        }

        .severity-meter-fill {
            height: 100%;
            background: linear-gradient(90deg, #51cf66, #ff9c42, #ff6b6b);
            width: 100%;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 14px;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
            padding: 12px;
            background: #f0f4ff;
            border-radius: 6px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .scroll-spacer {
            padding: 8px;
        }

        .deviant-badge {
            display: inline-block;
            padding: 2px 8px;
            background: #ffebee;
            color: #c62828;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Funnel Deviation Scan</h1>
            <span class="status-badge" id="status">Ready</span>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="total-charts">-</div>
                <div class="stat-label">Total Charts</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="deviations-count">0</div>
                <div class="stat-label">Deviations Found</div>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="scan-btn">🔍 Start Scan</button>
            <button class="btn-secondary" id="clear-btn">Clear</button>
        </div>

        <div class="results-container" id="results">
            <div class="empty-state">
                <div class="empty-state-icon">📋</div>
                <div>No results yet. Click "Start Scan" to begin.</div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
